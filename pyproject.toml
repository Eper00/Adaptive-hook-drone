[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-hook-drone"
version = "1.0.0"
description = "Payload grasping and transport with a spiral-manipulator quadcopter in MuJoCo: hierarchical RL, ResNet-based MPC, and a predictive safety filter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# tested versions: requirements.txt
dependencies = [
    "numpy>=1.24",
    "gymnasium>=1.0",
    "mujoco>=3.2",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "casadi>=3.6",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "tensorboard>=2.14",
]

[tool.setuptools.packages.find]
include = ["multi_drone_mujoco*", "utilities*"]

[tool.setuptools.package-data]
multi_drone_mujoco = ["assets/**/*"]
